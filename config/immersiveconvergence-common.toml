
#Mechanical system global settings
[mechanical]
	#Global maximum rotational speed in RPM for all mechanical devices (turbines, alternators, etc.). Default 7200 RPM. Changing this affects speed_factor calculations in turbines.
	#Range: 1000 ~ 50000
	max_rpm = 7200

#Heat system global settings
[heat]
	#Global maximum heat level for all heat-related devices. Default 2000.0
	#Range: 100.0 ~ 10000.0
	max_heat = 2000.0

#Multiblock settings shared by every machine built on Immersive Convergence, Immersive Engineering's and Immersive Petroleum's included
[multiblocks]
	#How a machine comes apart. PROCESS_QUEUE breaks it down block by block over a few ticks and drops all its materials at the broken block; TEMPLATE_BLOCKS instantly reverts it to its placed blocks. Sneaking while breaking always uses TEMPLATE_BLOCKS.
	#Allowed Values: PROCESS_QUEUE, TEMPLATE_BLOCKS
	disassembly_mode = "PROCESS_QUEUE"

